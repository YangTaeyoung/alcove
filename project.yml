name: Alcove
options:
  bundleIdPrefix: io.github.yangtaeyoung
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
packages:
  AlcoveKit:
    path: AlcoveKit
targets:
  Alcove:
    type: application
    platform: macOS
    sources:
      - path: Alcove/Sources
      # XcodeGen infers the resources build phase from the file type, so the
      # asset catalogue belongs in `sources` (there is no `resources` key).
      - path: Alcove/Resources/Assets.xcassets
    # Contents/MacOS/alcove-proxy, from build/alcove-proxy (scripts/test/all.sh builds it).
    postBuildScripts:
      - name: Copy alcove-proxy
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/build/alcove-proxy
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/alcove-proxy
        script: |
          proxy="$SRCROOT/build/alcove-proxy"
          if [ ! -x "$proxy" ]; then
            echo "error: $proxy is missing; build it with scripts/test/all.sh or with (cd guest-tools && GOOS=darwin GOARCH=arm64 go build -o ../build/alcove-proxy ./cmd/alcove-proxy), then build the app again"
            exit 1
          fi
          cp -f "$proxy" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/alcove-proxy"
    dependencies:
      - package: AlcoveKit
        product: AlcoveDisplayProtocol
      - package: AlcoveKit
        product: AlcoveQMP
      - package: AlcoveKit
        product: AlcoveEngine
      - package: AlcoveKit
        product: AlcoveAgent
      - package: AlcoveKit
        product: AlcoveControl
    info:
      path: Alcove/Info.plist
      properties:
        CFBundleName: Alcove
        CFBundleDisplayName: Alcove
        CFBundleIdentifier: io.github.yangtaeyoung.Alcove
        CFBundleShortVersionString: "0.2.2"
        CFBundleVersion: "4"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yangtaeyoung.Alcove
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_LDFLAGS: ["-framework", "Metal", "-framework", "MetalKit"]
